server.port: 9999
spring:
  profiles.active: native
  profiles:
    include: jdbc
  jms:
    pub-sub-domain: true
  datasource:
    # Database connection should be added here
    url: jdbc:postgresql://localhost:5432/config
    username: vladimir
    password: newpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    config:
      server:
        native.searchLocations: file:${user.home}/.arkcase/acm/acm-config-server-repo,file:${user.home}/.arkcase/acm/acm-config-server-repo/labels,file:${user.home}/.arkcase/acm/acm-config-server-repo/ldap,file:${user.home}/.arkcase/acm/acm-config-server-repo/lookups,file:${user.home}/.arkcase/acm/acm-config-server-repo/rules
        jdbc: # we do not need custom SQL unless our table structure is custom
          enabled: true
          order: 1
          sql: SELECT KEY, VALUE from PROPERTIES where APPLICATION=? and PROFILE=?
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

#spring.cloud.config.server.git.uri: file:///c:/dev/arkcase-config
#spring.cloud.config.server.git.clone-on-start: true
#spring.security.user.name: root

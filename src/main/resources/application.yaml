properties.folder.path: ${user.home}/.arkcase/acm/acm-config-server-repo
branding.files.folder.path: ${user.home}/.arkcase/acm/acm-config-server-repo/branding
logging:
  level:
    org.hibernate: ERROR
    org.hibernate.SQL: ERROR
    org.hibernate.type: ERROR
    org.hibernate.type.descriptor: ERROR
    org.hibernate.type.descriptor.sql: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
    com.armedia.acm.configserver: debug
    org.springframework.cloud.config: ERROR
  file.max-history: 10
  file.max-size: 10MB
  file: logs/acmConfigServer.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss,SSS} [%thread] %-5level %logger.%M - %msg%n"
jms.message.buffer.window: 1
acm.activemq:
  broker-url: ssl://acm-arkcase:61616
  keystore: ${user.home}/.arkcase/acm/private/arkcase.ks
  keystore-password: AcMd3v$
  truststore: ${user.home}/.arkcase/acm/private/arkcase.ts
  truststore-password: password
  user: "guest"
  password: "guest"
  default-destination: configuration.changed
  labels-destination: labels.changed
  ldap-destination: ldap.changed
  lookups-destination: lookups.changed
  rules-destination: rules.changed
  permissions-destination: permissions.changed
  timeout: 10 #seconds
arkcase:
  languages:
    - "-de"
    - "-en"
    - "-en-in"
    - "-es"
    - "-fr"
    - "-hi"
    - "-ja"
    - "-pt"
    - "-ru"
    - "-zh-cn"
    - "-zh-tw"
    - "-ar"
  folders: # This list should be updated - list of folders to be imported to DB
    - "${user.home}/.arkcase/acm/acm-config-server-repo"
  #  - "${user.home}/.arkcase/acm/acm-config-server-repo/labels"
  #   - "${user.home}/.arkcase/acm/acm-config-server-repo/ldap"
  #   - "${user.home}/.arkcase/acm/acm-config-server-repo/lookups"
  #    - "/home/vladimir/IdeaProjects/acm-config/acm/acm-config-server-repo/rules"
  profiles:
    - "foia"
    - "privacy"
    - "custom"
    - "server"
    - "runtime"

